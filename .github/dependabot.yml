version: 2
updates:
  # Bun dependencies are not listed: Dependabot's Bun support cannot read the
  # lockfile format (version 2) that current Bun releases write.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
